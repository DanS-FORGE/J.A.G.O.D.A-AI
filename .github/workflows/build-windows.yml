# .github/workflows/build-windows.yml
name: Build Windows Installer

# On-demand build of the J.A.G.O.D.A Windows NSIS installer
# (apps/bootstrap-installer). Manual trigger only (workflow_dispatch): this
# is a standalone workflow, not wired into the ci.yaml orchestrator, so a
# Rust release build never adds cost or latency to normal PR/push checks.
# Trigger it from the Actions tab when a build needs testing.
#
# Everything below runs on GitHub's own windows-latest hosted runner. Nothing
# is installed on any developer's local machine. Rust/Cargo, the target, and
# npm dependencies are all installed fresh inside the ephemeral runner VM and
# discarded when the job ends.
#
# Uses the existing apps/bootstrap-installer/src-tauri/Cargo.toml and
# tauri.conf.json as-is (productName "J.A.G.O.D.A", binary name
# "J.A.G.O.D.A-Setup", bundle target "nsis") — this workflow does not modify
# either file.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Root install: this is an npm workspaces repo (apps/* is a workspace
      # glob), so a root `npm ci` resolves apps/bootstrap-installer's
      # dependencies too, exactly per the committed package-lock.json.
      - name: Install Node dependencies (npm ci)
        uses: ./.github/actions/retry
        with:
          command: npm ci

      # Installed on THIS GitHub-hosted runner only — never on a developer's
      # own machine. dtolnay/rust-toolchain pinned to the `stable` branch head.
      - name: Install Rust toolchain (GitHub runner only)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      # Keyed on Cargo.toml only, matching rust-tests.yml: this crate ships
      # no committed Cargo.lock (see apps/bootstrap-installer/.gitignore), so
      # there is nothing else to hash.
      - name: Restore cargo cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/bootstrap-installer/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/bootstrap-installer/src-tauri/Cargo.toml') }}

      # Equivalent to `npm run tauri build`: runs the existing "tauri:build"
      # script (apps/bootstrap-installer/package.json), which invokes
      # `tauri build` via the already-installed @tauri-apps/cli. Tauri reads
      # tauri.conf.json's own `bundle.targets` (["app","dmg","appimage","nsis"])
      # and, on Windows, produces the nsis bundle.
      - name: Build Windows NSIS installer
        working-directory: apps/bootstrap-installer
        run: npm run tauri:build

      - name: Locate NSIS installer
        id: find-installer
        shell: pwsh
        run: |
          $bundleDir = "apps/bootstrap-installer/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem -Path $bundleDir -Filter "*.exe" -Recurse -ErrorAction Stop | Select-Object -First 1
          if (-not $exe) {
            throw "No NSIS installer .exe found under $bundleDir"
          }
          Write-Host "Found installer: $($exe.FullName)"
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: J.A.G.O.D.A-Windows-Installer
          path: ${{ steps.find-installer.outputs.path }}
          if-no-files-found: error
